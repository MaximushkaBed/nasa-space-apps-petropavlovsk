name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-global.txt
      - run: python -m unittest discover -s tests -v
      - run: docker compose -f deploy/compose.yml config --quiet
      - run: docker build -f deploy/Dockerfile -t nasa-space-apps-web:ci .
      - name: Scan web image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: nasa-space-apps-web:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - run: docker build -f deploy/Dockerfile.data -t nasa-space-apps-data:ci .
      - name: Scan data image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: nasa-space-apps-data:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Verify workspace Compose
        env:
          NASA_OKSANA_UID: '1000'
          NASA_OKSANA_GID: '1000'
        run: docker compose -f deploy/compose.workspace.yml config --quiet
      - run: docker build -f deploy/Dockerfile.workspace -t nasa-space-apps-workspace:ci .
      - name: Scan workspace image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: nasa-space-apps-workspace:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
