# Install only this vhost into /root/platforms/nginx/conf.d/.
# Once the A record points to unik, issue a certificate and enable HTTPS.
server {
    listen 80;
    server_name nasa.aican.cloud;
    location ^~ /.well-known/acme-challenge/ { root /var/www; }
    location / {
        set $up "nasa-space-apps-web:8080";
        proxy_pass http://$up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
