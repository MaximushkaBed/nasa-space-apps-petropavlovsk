# Install only this vhost into /root/platforms/nginx/conf.d/.
# Certificate was issued through the existing Certbot account on unik.
server {
    listen 80;
    server_name nasa.aican.cloud;
    location ^~ /.well-known/acme-challenge/ { root /var/www; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name nasa.aican.cloud;
    ssl_certificate /etc/letsencrypt/live/nasa.aican.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nasa.aican.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        set $up "nasa-space-apps-web:8080";
        proxy_pass http://$up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
