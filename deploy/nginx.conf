pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    resolver 127.0.0.11 valid=30s ipv6=off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /srv/web;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        location = /health { access_log off; return 200 "ok\n"; }
        location /api/v1/ {
            set $analysis http://nasa-space-apps-analysis:8081;
            proxy_pass $analysis;
            proxy_read_timeout 45s;
            client_max_body_size 512k;
        }
        location /api/fires/ {
            set $fires http://nasa-space-apps-global-fires:8081;
            proxy_pass $fires;
            proxy_read_timeout 30s;
        }
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache";
        }
        location = /data/world-atlas.json {
            gzip on;
            gzip_types application/json;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff;
        }
        # Only public scientific datasets are mounted here; keys live elsewhere.
        location /datasets/ {
            alias /srv/datasets/;
            autoindex on;
            autoindex_exact_size off;
            add_header Cache-Control "no-cache";
        }
        location ~ (^|/)\. { deny all; }
    }
}
