<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="370" viewBox="0 0 1600 370" role="img" aria-labelledby="title desc">
  <title id="title">From satellite observations to a study you can inspect</title>
  <desc id="desc">MODIS and VIIRS feed the archive. A selected territory and scientific conditions pass availability and validation checks before producing calendars, comparisons and exports.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#91b9df" stroke-width="1.2"/></marker></defs>
  <rect width="1600" height="370" rx="16" fill="#0b192d"/>
  <text x="40" y="48" fill="#b7cbdf" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">FROM SATELLITE OBSERVATIONS TO A STUDY YOU CAN INSPECT</text>
  <g fill="none" stroke="#91b9df" stroke-width="2" marker-end="url(#arrow)">
    <path d="M260 128H280V183H300"/><path d="M260 230H280V183H300"/>
    <path d="M520 183H560M860 183H900M1160 183H1200"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="40" y="86" width="220" height="86" rx="8" fill="#16324c" stroke="#497291"/>
    <text x="60" y="122" fill="#eef5fb" font-size="23" font-weight="700">MODIS</text><text x="60" y="149" fill="#afc5dc" font-size="16">Terra · Aqua</text>
    <rect x="40" y="188" width="220" height="86" rx="8" fill="#16324c" stroke="#497291"/>
    <text x="60" y="224" fill="#eef5fb" font-size="23" font-weight="700">VIIRS</text><text x="60" y="251" fill="#afc5dc" font-size="16">S-NPP · NOAA-20 / 21</text>
    <rect x="300" y="131" width="220" height="104" rx="8" fill="#142a42" stroke="#497291"/>
    <text x="320" y="169" fill="#eef5fb" font-size="21" font-weight="700">GLOBAL ARCHIVE</text><text x="320" y="200" fill="#afc5dc" font-size="15">FIRMS · source provenance</text>
    <rect x="560" y="86" width="300" height="188" rx="8" fill="#142a42" stroke="#7ca7cf"/>
    <text x="582" y="124" fill="#e3f20b" font-size="13" letter-spacing="2">YOUR STUDY</text>
    <text x="582" y="158" fill="#eef5fb" font-size="22" font-weight="700">Choose a territory</text>
    <text x="582" y="193" fill="#afc5dc" font-size="17">Dates · reference years</text><text x="582" y="224" fill="#afc5dc" font-size="17">Grid · platform · quality</text>
    <rect x="900" y="86" width="260" height="188" rx="8" fill="#2b2527" stroke="#bd784f"/>
    <text x="922" y="124" fill="#f5ba98" font-size="13" letter-spacing="2">CHECK THE EVIDENCE</text>
    <text x="922" y="158" fill="#eef5fb" font-size="20" font-weight="700">Is comparison valid?</text>
    <text x="922" y="193" fill="#d1b9ae" font-size="16">Usable dates · SP / NRT</text><text x="922" y="224" fill="#d1b9ae" font-size="16">Held-out calibration checks</text>
    <rect x="1200" y="86" width="360" height="188" rx="8" fill="#142a42" stroke="#497291"/>
    <text x="1222" y="124" fill="#8ebdf0" font-size="13" letter-spacing="2">EXPLORE THE RESULT</text>
    <text x="1222" y="158" fill="#eef5fb" font-size="22" font-weight="700">Calendars + comparisons</text>
    <text x="1222" y="193" fill="#afc5dc" font-size="17">Seasonality · unusual activity</text><text x="1222" y="224" fill="#afc5dc" font-size="17">Inspect · save · export</text>
    <path d="M40 305H1560" stroke="#273c53"/>
    <text x="40" y="339" fill="#91a9c1" font-size="16">Correction is experimental and shown only where its checks pass. Product availability does not prove clear-sky coverage.</text>
  </g>
</svg>
